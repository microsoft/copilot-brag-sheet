name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm test

  install-smoke:
    name: install-smoke (${{ matrix.os }} / ${{ matrix.shell }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: bash
            cmd: ./install.sh
          - os: macos-latest
            shell: bash
            cmd: ./install.sh
          # Windows PowerShell 5.1 (default on Windows) — caught the v1.0.1 install bug
          - os: windows-latest
            shell: powershell
            cmd: ./install.ps1
          # Windows PowerShell 7+
          - os: windows-latest
            shell: pwsh
            cmd: ./install.ps1
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Run installer
        shell: ${{ matrix.shell }}
        env:
          # Isolate from any preexisting state on hosted runners
          COPILOT_HOME: ${{ runner.temp }}/copilot-home-test
        run: ${{ matrix.cmd }}
      - name: Verify install layout
        shell: bash
        env:
          COPILOT_HOME: ${{ runner.temp }}/copilot-home-test
        run: |
          target="$COPILOT_HOME/extensions/copilot-brag-sheet"
          for f in extension.mjs lib/paths.mjs lib/storage.mjs bin/setup.mjs package.json; do
            if [ ! -f "$target/$f" ]; then
              echo "❌ Missing: $f"
              ls -laR "$target" || true
              exit 1
            fi
          done
          echo "✅ All required files installed at $target"
      - name: Verify npm install path (bin/install.mjs)
        shell: bash
        env:
          COPILOT_HOME: ${{ runner.temp }}/copilot-home-npm-test
        run: |
          rm -rf "$COPILOT_HOME"
          node bin/install.mjs < /dev/null
          target="$COPILOT_HOME/extensions/copilot-brag-sheet"
          test -f "$target/extension.mjs" && echo "✅ npm install path works"
