name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write  # required for npm provenance attestation

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm test

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org/'

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Validate version matches package.json
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${{ steps.version.outputs.version }}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json ($PKG_VERSION)"
            exit 1
          fi

      - name: Validate tarball contents
        run: |
          # Required files that must be in the published tarball.
          # If we add a new lib/foo.mjs and forget to update package.json's "files"
          # whitelist, this catches it before the broken publish goes out.
          REQUIRED=(
            extension.mjs
            plugin.json
            package.json
            bin/install.mjs
            bin/setup.mjs
            lib/config.mjs
            lib/git-backup.mjs
            lib/lock.mjs
            lib/paths.mjs
            lib/records.mjs
            lib/render.mjs
            lib/storage.mjs
          )
          npm pack --dry-run --json > /tmp/pack.json
          node -e "
            const required = process.env.REQUIRED.split('\n').filter(Boolean);
            const pack = JSON.parse(require('fs').readFileSync('/tmp/pack.json', 'utf8'));
            const got = new Set(pack[0].files.map(f => f.path));
            const missing = required.filter(f => !got.has(f));
            if (missing.length) {
              console.error('::error::Missing in tarball:');
              missing.forEach(f => console.error('  - ' + f));
              process.exit(1);
            }
            console.log('Tarball contains all', required.length, 'required files.');
          "
        env:
          REQUIRED: |
            extension.mjs
            plugin.json
            package.json
            bin/install.mjs
            bin/setup.mjs
            lib/config.mjs
            lib/git-backup.mjs
            lib/lock.mjs
            lib/paths.mjs
            lib/records.mjs
            lib/render.mjs
            lib/storage.mjs

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Extract the section for this version from CHANGELOG.md
          awk "/^## \[${VERSION}\]/{found=1; next} /^## \[/{if(found) exit} found" CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "No changelog entry found for version $VERSION" > release_notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm
        # Skip pre-release tags (e.g. v1.0.0-rc1) so we can experiment without polluting the registry
        if: ${{ !contains(github.ref_name, '-') }}
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
